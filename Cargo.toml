[package]
name = "check-skills"
version = "0.1.0"
edition = "2021"
description = "Refuses a skills tree that Claude Code would load wrongly without saying so."
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "check-skills"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
